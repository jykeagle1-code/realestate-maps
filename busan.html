<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>부산 입주 지도</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 위에서 아래로 사이클 → 연도 선택 → 지도(데스크톱은 옆에 요약) → 연도별 막대 */
:root{
  --bg:#F3F5F4; --panel:#FFFFFF; --ink:#1B2127; --muted:#5C6670; --faint:#8C959E; --line:#DCE1E3;
  --sea:#DCE6EC; --land:#FBFBF8; --land2:#EEF0EC; --gu:#B9C2C8; --price:#D93025; --ma:#1F3A5F; --guline:#2F6FB5;
  --over:#E8743B; --under:#B8C0CA; --band:rgba(239,159,39,.14); --accent:#C2561E; --chip:#EEF1F0; --unsold:#7B3FA8; --unsold:#7B3FA8;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111518; --panel:#192024; --ink:#E7ECEF; --muted:#9DA7B0; --faint:#6F7A83; --line:#2B343A;
  --sea:#0E1A22; --land:#1F272C; --land2:#192024; --gu:#3D4950; --price:#FF7B70; --ma:#A9C3EA; --guline:#7FB2E5;
  --over:#E8743B; --under:#59636B; --band:rgba(239,159,39,.16); --accent:#F0A06A; --chip:#222A2F; --unsold:#C9A6EC; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111518; --panel:#192024; --ink:#E7ECEF; --muted:#9DA7B0; --faint:#6F7A83; --line:#2B343A;
  --sea:#0E1A22; --land:#1F272C; --land2:#192024; --gu:#3D4950; --price:#FF7B70; --ma:#A9C3EA; --guline:#7FB2E5;
  --over:#E8743B; --under:#59636B; --band:rgba(239,159,39,.16); --accent:#F0A06A; --chip:#222A2F; --unsold:#C9A6EC; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:26px;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0;font-size:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.ctitle{font-size:13px;font-weight:700;color:var(--muted);margin:0 0 8px;letter-spacing:.02em}
svg text{font-family:var(--f-body)}
.num{font-variant-numeric:tabular-nums}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctrl label{font-size:13px;color:var(--muted)}
select{font:inherit;font-size:14px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.chip{font:inherit;font-size:13px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:700}
.chip:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12px;color:var(--muted)}
.ramp{height:10px;width:180px;border-radius:5px}
.main{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:920px){.main{grid-template-columns:minmax(0,1fr) 330px}
  /* 오른쪽 열은 왼쪽(지도+기간 막대) 높이까지만, 구·군 표는 그 안에서 스크롤 */
  .side{contain:size;min-height:0}
  .gucard{flex:1;min-height:0;display:flex;flex-direction:column}
  .guscroll{flex:1;min-height:0;overflow-y:auto;margin-right:-8px;padding-right:8px}
  .guscroll thead th{position:sticky;top:0;background:var(--panel);z-index:1}}
#map{height:min(70vh,620px);min-height:380px;border-radius:14px;border:1px solid var(--line);background:var(--sea)}
.leaflet-container{font-family:var(--f-body);background:var(--sea)}
.gu-label{background:transparent;border:0;box-shadow:none;color:var(--faint);font-weight:700;font-size:12px;padding:0}
.gu-label:before{display:none}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--ink)}
.leaflet-popup-content{margin:10px 12px;font-size:13px;line-height:1.5}
.leaflet-popup-content a{color:var(--accent);font-weight:700}
.leaflet-control-attribution{background:color-mix(in srgb,var(--panel) 85%,transparent)!important;color:var(--muted)!important;font-size:10px}
.leaflet-control-attribution a{color:var(--muted)!important}
.leaflet-bar a{background:var(--panel);color:var(--ink);border-color:var(--line)}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--chip);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:22px;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px}
.pill.over{background:rgba(232,116,59,.16);color:var(--accent)}
.pill.under{background:rgba(120,135,148,.18);color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:5px 4px;text-align:right;border-bottom:1px solid var(--line)}
th{font-weight:500;color:var(--muted);font-size:12px}
td:first-child,th:first-child{text-align:left}
tr.gu{cursor:pointer}
tr.gu td{transition:background .18s,color .18s}
tr.gu:hover td{background:var(--chip)}
tr.gu.on td{background:color-mix(in srgb,var(--accent) 11%,var(--panel));color:var(--ink);font-weight:700;border-bottom-color:transparent}
tr.gu.on td:first-child{box-shadow:inset 3px 0 0 var(--accent);color:var(--accent);padding-left:10px;border-radius:6px 0 0 6px}
tr.gu.on td:last-child{border-radius:0 6px 6px 0}
tr.gu.on .bar{opacity:1}
.bar{height:8px;border-radius:4px;background:var(--over);opacity:.75}
details.note summary{cursor:pointer}
.scope{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:var(--chip);color:var(--muted);font-size:11px;font-weight:600;vertical-align:1px}
.note{font-size:12px;color:var(--faint);margin:0}
.rlab{font-size:14px}
.rlab b{font-size:17px;color:var(--accent)}
.rng{position:relative;height:42px;margin:4px 8px 0}
.rng .trk,.rng .fill{position:absolute;top:22px;height:10px;border-radius:5px}
.rng .trk{left:0;right:0;background:var(--line)}
.rng .fill{background:var(--accent);cursor:grab;touch-action:none;z-index:1}
.rng .fill:active{cursor:grabbing}
.rng input{position:absolute;z-index:2;left:-8px;width:calc(100% + 16px);top:12px;height:30px;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
.rng input::-webkit-slider-runnable-track{background:none;border:0}
.rng input::-moz-range-track{background:none;border:0}
.rng input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:20px;height:20px;border-radius:50%;background:var(--panel);border:2.5px solid var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.25);cursor:grab}
.rng input::-moz-range-thumb{pointer-events:auto;width:16px;height:16px;border-radius:50%;background:var(--panel);border:2.5px solid var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.25);cursor:grab}
.rtick{position:relative;height:16px;margin:0 8px;font-size:11px;color:var(--muted)}
.rtick span{position:absolute;transform:translateX(-50%)}
.mapwrap{min-width:0;align-self:start;display:flex;flex-direction:column;gap:8px}
.mapbox{position:relative}
.period{padding:10px 14px 6px}
.rng .ytk{position:absolute;top:22px;width:1px;height:10px;background:var(--muted);opacity:.55}
.rng .nowm{position:absolute;top:0;height:30px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none;z-index:0}
.rng .nowm span{font-size:10px;font-weight:700;line-height:1;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--panel));border-radius:999px;padding:2px 6px;white-space:nowrap}
.rng .nowm i{display:block;width:0;height:0;margin-top:3px;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid var(--accent)}
.rtick .now{color:var(--ink);font-weight:700}
.mapleg{position:absolute;right:10px;bottom:10px;z-index:5;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:11px;color:var(--muted);max-width:calc(100% - 20px);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.mapleg .lt{font-weight:700;margin-bottom:3px}
.yl{display:flex;flex-direction:column;gap:1px}
.yl button{font:inherit;font-size:11px;color:var(--muted);background:none;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:4px;padding:2px 5px;border-radius:6px}
.yl button[aria-pressed="true"]{border-color:var(--accent);color:var(--ink);font-weight:700}
.yl i{display:inline-block;width:11px;height:11px;border-radius:50%}
.sizeleg{display:flex;align-items:flex-end;gap:12px}
.sizeleg div{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted)}
.sizeleg i{display:block;border:1.4px solid var(--muted);border-radius:50%}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>부산 입주 지도</h1>
  </header>

  <div class="main">
    <div class="mapwrap">
      <div class="mapbox">

          <div class="lt">입주 연도</div>
          <div class="yl" id="yearleg"></div>
        </div>
      </div>
      <div class="card period" aria-label="기간 선택">
        <div class="ctrl" style="justify-content:space-between">
          <span class="rlab num"><b id="rl0"></b> ~ <b id="rl1"></b></span>
        </div>

          <div class="trk"></div><div class="fill" id="rfill"></div>
          <input type="range" id="y0" aria-label="시작 월"><input type="range" id="y1" aria-label="끝 월">
        </div>
        <div class="rtick num" id="rtick"></div>
      </div>
    </div>
    <aside class="side">
      <section class="card gucard">
        <p class="ctitle">시군구</p>
        <div class="guscroll">
        <table><thead><tr><th>시군구</th><th>세대</th><th>단지</th><th style="width:34%"></th></tr></thead><tbody id="gutab"></tbody></table>
        </div>
      </section>
      <section class="card">
        <p class="ctitle" id="sel-title">선택 기간</p>
        <div class="stats">
          <div class="stat"><b class="num" id="s-h">-</b><span>입주 세대</span></div>
          <div class="stat"><b class="num" id="s-n">-</b><span>단지</span></div>
          <div class="stat" style="grid-column:1/-1"><span>연평균</span> <b class="num" id="s-avg" style="display:inline;font-size:18px">-</b>
            <span>· 적정 연 <span class="num" id="s-fair"></span>세대</span> <span id="s-pill" class="pill"></span></div>
        </div>
      </section>
    </aside>
  </div>

  <section class="card" aria-label="연도별 입주">
    <p class="ctitle">연도별 입주 · <span style="color:var(--price)">가격지수</span> <span class="scope">부산광역시</span></p>
    <svg id="yb" viewBox="0 0 1000 130" width="100%" role="img" aria-label="연도별 입주 세대 막대"></svg>
  </section>

  <section class="card" aria-label="사이클 그래프">
    <p class="ctitle">가격과 입주 사이클 <span class="scope">부산광역시</span></p>
    <svg id="cyc" viewBox="0 0 1000 215" width="100%" role="img" aria-label="가격과 분기 입주 그래프"></svg>
    <div class="legend">
            <span><svg width="22" height="8"><line x1="0" y1="4" x2="22" y2="4" style="stroke:var(--price)" stroke-width="3"/></svg> 매매지수</span>
      <span><svg width="12" height="12"><circle cx="6" cy="6" r="4" style="fill:var(--panel);stroke:var(--price)" stroke-width="2"/></svg> 사이클 고점</span>
      <span><svg width="12" height="10"><rect width="12" height="10" style="fill:var(--over)" opacity=".6"/></svg> 분기 입주</span>
      <span><svg width="22" height="8"><line x1="0" y1="4" x2="22" y2="4" style="stroke:var(--ma)" stroke-width="2.6"/></svg> 이동공급합(전후 반년)</span>
      <span><svg width="22" height="8"><line x1="0" y1="4" x2="22" y2="4" style="stroke:var(--unsold)" stroke-width="2.6"/></svg> 미분양</span>
      <span><svg width="22" height="8"><line x1="0" y1="4" x2="22" y2="4" style="stroke:var(--unsold)" stroke-width="2" stroke-dasharray="3 3"/></svg> 준공 후 미분양</span>
      <span><svg width="22" height="8"><line x1="0" y1="4" x2="22" y2="4" style="stroke:var(--muted)" stroke-dasharray="4 4" stroke-width="1.4"/></svg> 적정공급량</span>
    </div>
  </section>

  <details class="note"><summary>자료·기준</summary>
  <p>입주: 한국부동산원 단지정보(~2025), 주택인허가(2026), 청약홈 입주예정(2026.10~) · 가격: 한국부동산원 매매지수 · 미분양: 국토부 · 적정 입주 = 인구 × 0.5% · 예정 입주는 늦어질 수 있음 · 2026.10 기준</p>
</details>
</div>

  circles=rows.map(r=>{const c=new kakao.maps.Circle({map,center:new kakao.maps.LatLng(r[1],r[2]),radius:radM(r[5]),strokeWeight:1});c.r=r;
    kakao.maps.event.addListener(c,'click',()=>openInfo(r));
    kakao.maps.event.addListener(c,'mouseover',()=>{hoverDiv.innerHTML=`<b>${r[0]}</b> · ${fmt(r[5])}세대 · ${r[3]}.${String(r[4]).padStart(2,'0')}`;hover.setPosition(new kakao.maps.LatLng(r[1],r[2]));hover.setMap(map);c.setOptions({strokeWeight:3})});
    kakao.maps.event.addListener(c,'mouseout',()=>{hover.setMap(null);styleMarks()});return c});
  kakao.maps.event.addListener(map,'zoom_changed',()=>{const k=zk();circles.forEach(c=>c.setRadius(radM(c.r[5])*k))});
  kakao.maps.event.addListener(map,'click',()=>{if(overlay)overlay.setMap(null)});
  update();
}
function openInfo(r){
  if(overlay)overlay.setMap(null);
  const kn=encodeURIComponent(r[0].replace(/,/g,' '));
  const div=document.createElement('div');
  div.style.cssText='background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.5;box-shadow:0 4px 14px rgba(0,0,0,.18);transform:translateY(-12px);max-width:260px';
  div.innerHTML=`<b>${r[0]}</b><br>${r[3]}년 ${r[4]}월 ${r[3]>NOW_Y||(r[3]===NOW_Y&&r[4]>=NOW_M)?'입주 예정':'사용승인'} · <b>${fmt(r[5])}</b>세대<br><span style="color:var(--muted)">${r[6]||''} · ${r[7]}</span><div style="margin-top:6px;display:flex;gap:10px"><a style="color:var(--accent);font-weight:700" href="https://map.kakao.com/link/map/${kn},${r[1]},${r[2]}" target="_blank" rel="noopener">카카오맵</a><a style="color:var(--accent);font-weight:700" href="https://map.kakao.com/link/roadview/${r[1]},${r[2]}" target="_blank" rel="noopener">로드뷰</a></div>`;
  overlay=new kakao.maps.CustomOverlay({map,position:new kakao.maps.LatLng(r[1],r[2]),content:div,yAnchor:1,zIndex:10});
}
function styleMarks(){ if(!map) return;
  circles.forEach(c=>{const y=c.r[3],on=inSel(c.r),col=yc(y);
    const vis=on||ghost; if(!!c.getMap()!==vis) c.setMap(vis?map:null); if(!vis) return;  /* 기간 밖 단지는 지도에서 뺌(마우스 반응도 없음) */
    c.setOptions({strokeColor:dk(col),fillColor:col,fillOpacity:on?.62:(ghost?.1:0),strokeOpacity:on?.95:(ghost?.25:0),strokeWeight:on?1.4:1});
    c.setZIndex(on?2:1);});
  sizeLegend();
}
function mPerPx(){const p=map.getProjection(),c=map.getCenter(),a=p.pointFromCoords(c),b=p.containerPointFromCoords?null:null;
  const ll2=p.coordsFromPoint(new kakao.maps.Point(a.x+100,a.y));
  const R=6371000,toR=Math.PI/180,dl=(ll2.getLng()-c.getLng())*toR*Math.cos(c.getLat()*toR);return Math.abs(dl*R)/100}
function sizeLegend(){ if(!map||!document.getElementById('sizeleg')) return; const mpp=mPerPx();
  document.getElementById('sizeleg').innerHTML=[500,1000,2000].map(h=>{const r=Math.max(2,radM(h)/(mppHome||mpp));return `<div><i style="width:${2*r}px;height:${2*r}px"></i>${fmt(h)}</div>`}).join('');}
const guLayers={get:n=>guPolys[n]};
function goHome(){if(home){map.setLevel(home[1]);map.setCenter(home[0])}else if(cityBounds)map.setBounds(cityBounds)}
function fitGu(n){const p=guPolys[n];if(!p)return;const b=new kakao.maps.LatLngBounds();p.getPath().forEach(path=>(Array.isArray(path)?path:[path]).forEach(ll=>b.extend(ll)));map.setBounds(b)}

/* 요약·구별·연도 막대 */
function summary(){
  const on=DATA.rows.filter(inSel);
  const H=on.reduce((a,r)=>a+r[5],0), yrs=(sel[1]-sel[0]+1)/12, avg=H/yrs;
  document.getElementById('sel-title').textContent=sel[0]===sel[1]?`${ymLab(sel[0])} 입주`:`${ymLab(sel[0])} ~ ${ymLab(sel[1])} 입주`;
  document.getElementById('s-h').textContent=fmt(H);
  document.getElementById('s-n').textContent=fmt(on.length);
  document.getElementById('s-avg').textContent=fmt(avg);
  document.getElementById('s-fair').textContent=fmt(FAIR_Y);
  const p=document.getElementById('s-pill'), r=avg/FAIR_Y;
  p.className='pill '+(r>1?'over':'under'); p.textContent=r>1?`적정의 ${r.toFixed(1)}배 · 과다`:`적정의 ${Math.round(r*100)}% · 부족`;
  const g={}; on.forEach(r=>{g[r[6]]=g[r[6]]||[0,0];g[r[6]][0]+=r[5];g[r[6]][1]++});
  const arr=Object.entries(g).sort((a,b)=>b[1][0]-a[1][0]), mx=arr.length?arr[0][1][0]:1;
  const tb=document.getElementById('gutab'); tb.innerHTML='';
  const mark=()=>[...tb.children].forEach(r=>r.classList.toggle('on',r.dataset.gu===(selGu||'')));
  const all=document.createElement('tr');all.className='gu';all.tabIndex=0;all.dataset.gu='';
  all.innerHTML=`<td><b>${DATA.adm||DATA.city}</b></td><td class="num"><b>${fmt(H)}</b></td><td class="num"><b>${on.length}</b></td><td></td>`;
  const goAll=()=>{goHome();selGu=null;mark()};
  all.onclick=goAll; all.onkeydown=e=>{if(e.key==='Enter')goAll()}; tb.appendChild(all);
  arr.forEach(([n,[h,c]])=>{const tr=document.createElement('tr');tr.className='gu';tr.tabIndex=0;tr.dataset.gu=n;
    tr.innerHTML=`<td>${n}</td><td class="num">${fmt(h)}</td><td class="num">${c}</td><td><div class="bar" style="width:${(h/mx*100).toFixed(0)}%"></div></td>`;
    const go=()=>{selGu=(selGu===n?null:n);if(selGu)fitGu(n);else goHome();mark()};
    tr.onclick=go; tr.onkeydown=e=>{if(e.key==='Enter')go()}; tb.appendChild(tr)});
  mark();
  if(!arr.length) tb.insertAdjacentHTML('beforeend','<tr><td colspan="4" style="text-align:left;color:var(--muted)">이 기간에는 입주 단지가 없습니다.</td></tr>');
}
function yearBars(){
  const s=document.getElementById('yb'); s.innerHTML='';
  const NS='http://www.w3.org/2000/svg', el=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);s.appendChild(e);return e};
  const by={}; DATA.rows.forEach(r=>by[r[3]]=(by[r[3]]||0)+r[5]);
  const ys=[]; for(let y=Y_MIN;y<=Y_MAX;y++) ys.push(y);
  const mx=Math.max(FAIR_Y,...Object.values(by)), X0=40, W=(960-X0)/ys.length, sy=v=>108-v/mx*98;
  ys.forEach((y,i)=>{const v=by[y]||0,on=YM(y,12)>=sel[0]&&YM(y,1)<=sel[1];
    const r=el('rect',{x:X0+i*W+2,y:sy(v),width:W-4,height:108-sy(v),rx:2,fill:yc(y),'fill-opacity':on?.95:.3});
    const hit=el('rect',{x:X0+i*W,y:6,width:W,height:120,fill:'transparent',style:'cursor:pointer'});
    hit.addEventListener('click',()=>{sel=[YM(y,1),YM(y,12)];update()});
    const t=document.createElementNS(NS,'title');t.textContent=`${y}년 ${fmt(v)}세대`;hit.appendChild(t);
    if(y%5===0||(y===Y_MAX&&y%5>1)){const tt=el('text',{x:X0+i*W+W/2,y:125,'font-size':12,'text-anchor':'middle',fill:V('--muted')});tt.textContent=y}});
  el('line',{x1:X0,x2:960,y1:sy(FAIR_Y),y2:sy(FAIR_Y),stroke:V('--muted'),'stroke-dasharray':'4 4'});
  const t=el('text',{x:962,y:sy(FAIR_Y)+4,'font-size':11,fill:V('--muted')});t.textContent='적정';
  [10000,20000,30000].filter(v=>v<mx).forEach(v=>{const e=el('text',{x:X0-6,y:sy(v)+4,'font-size':11,'text-anchor':'end',fill:V('--faint')});e.textContent=v/10000+'만'});

  /* 가격지수(사이클 그래프와 같은 선) — 막대 위에 겹쳐 아래부터 전체 높이 사용 */
  const pr=smooth4(DATA.price||[]), pg=[] /* 그래프는 구 선택과 무관하게 도시 전체 고정 */; if(!pr.length) return;
  const vs=pr.concat(pg).map(p=>p[1]), lo=Math.min(...vs), hi=Math.max(...vs), py=v=>106-(v-lo)/(hi-lo)*92;
  const kx=k=>X0+(+k.slice(0,4)+(+k.slice(5,7)-1+(+k.slice(8,10)-1)/31)/12-Y_MIN)*W;
  const ok=k=>+k.slice(0,4)>=Y_MIN&&kx(k)<=960;
  if(pg.length) el('path',{d:curve(pg.filter(p=>ok(p[0])).map(([k,v])=>[kx(k),py(v)])),fill:'none',stroke:V('--guline'),'stroke-width':1.8,'stroke-dasharray':'5 3','pointer-events':'none'});
  const P=pr.filter(p=>ok(p[0]));
  el('path',{d:curve(P.map(([k,v])=>[kx(k),py(v)])),fill:'none',stroke:V('--price'),'stroke-width':2.4,'stroke-linejoin':'round','pointer-events':'none'});
  const L=P[P.length-1], e=el('text',{x:kx(L[0])+4,y:py(L[1])+4,'font-size':11,fill:V('--price'),'font-weight':700,'paint-order':'stroke',stroke:V('--panel'),'stroke-width':3,'pointer-events':'none'});e.textContent='가격';
}
function ramp(){const box=document.getElementById('yearleg'); box.innerHTML='';
  const past=[R0,YM(NOW_Y-1,12)], g=`linear-gradient(90deg,${yc(Y_MIN)},${yc(NOW_Y-1)})`;
  const mk=(html,r,lab)=>{const b=document.createElement('button');b.type='button';b.innerHTML=html;b.dataset.r=r.join('-');b.setAttribute('aria-label',lab);
    b.onclick=()=>{sel=(sel.join('-')===b.dataset.r)?[R0,R1]:[...r];update()};box.appendChild(b)};
  mk('<i style="background:none;border:1px dashed var(--muted)"></i>전체',[R0,R1],'전체 기간');
  mk(`<i style="background:${g}"></i>${yOf(R0)}~${NOW_Y-1}`,past,`${NOW_Y-1}년까지`);
  for(let y=NOW_Y;y<=Y_MAX;y++){const c=yc(y);mk(`<i style="background:${c};border:1px solid ${dk(c)}"></i>${y}`,[YM(y,1),YM(y,12)],`${y}년`)}
}
/* 컨트롤 */
const s0=document.getElementById('y0'), s1=document.getElementById('y1');
[s0,s1].forEach(i=>{i.min=R0;i.max=R1;i.step=1});
const cl=v=>Math.max(R0,Math.min(R1,v)), pct=v=>(cl(v)-R0)/(R1-R0)*100;
/* 선택 구간(주황 막대)을 잡고 끌면 기간 길이를 유지한 채 앞뒤로 이동 */
{const f=document.getElementById('rfill'), box=document.querySelector('.rng'); let st=null;
  f.addEventListener('pointerdown',e=>{st={x:e.clientX,a:cl(sel[0]),b:cl(sel[1])};f.setPointerCapture(e.pointerId);e.preventDefault()});
  f.addEventListener('pointermove',e=>{if(!st)return;const d=Math.round((e.clientX-st.x)/box.clientWidth*(R1-R0));
    const dd=Math.max(R0-st.a,Math.min(R1-st.b,d)); if(sel[0]!==st.a+dd){sel=[st.a+dd,st.b+dd];later()}});
  const end=()=>{st=null}; f.addEventListener('pointerup',end); f.addEventListener('pointercancel',end);}
document.getElementById('rtick').innerHTML=[...Array(yOf(R1)-yOf(R0)).keys()].map(i=>yOf(R0)+1+i).map(y=>`<span style="left:${pct(YM(y,1))}%"${y===NOW_Y?' class="now"':''}>${y}</span>`).join('');
[...Array(yOf(R1)-yOf(R0)).keys()].forEach(i=>{const t=document.createElement('div');t.className='ytk';t.style.left=pct(YM(yOf(R0)+1+i,1))+'%';document.querySelector('.rng').prepend(t)});
{const n=document.createElement('div');n.className='nowm';n.style.left=pct(YM(NOW_Y,NOW_M))+'%';n.innerHTML=`<span>현재 ${String(NOW_Y).slice(2)}.${String(NOW_M).padStart(2,'0')}</span><i></i>`;document.querySelector('.rng').prepend(n)}
let raf=0; const later=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(update)};
/* 두 손잡이가 같은 해에 겹쳐 있을 때는 끄는 방향에 따라 시작·끝 중 맞는 쪽이 움직인다 */
s0.oninput=()=>{const v=+s0.value; sel=v<=sel[1]?[v,sel[1]]:(sel[0]===sel[1]?[sel[0],v]:[sel[1],sel[1]]); later()};
s1.oninput=()=>{const v=+s1.value; sel=v>=sel[0]?[sel[0],v]:(sel[0]===sel[1]?[v,sel[1]]:[sel[0],sel[0]]); later()};
/* 두 손잡이가 겹치면 끝 손잡이를 위로: 왼쪽 끝에 몰렸을 때는 시작 손잡이를 위로 */
const zfix=()=>{s0.style.zIndex=sel[0]>=R1-1?4:2;s1.style.zIndex=3};
function update(){s0.value=cl(sel[0]);s1.value=cl(sel[1]);zfix();
  const f=document.getElementById('rfill');f.style.left=pct(sel[0])+'%';f.style.width=Math.max(.6,pct(sel[1])-pct(sel[0]))+'%';
  document.getElementById('rl0').textContent=ymLab(sel[0]);document.getElementById('rl1').textContent=ymLab(sel[1]);
  document.querySelectorAll('#yearleg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.r===sel.join('-')));
  
  drawCycle();styleMarks();summary();yearBars()}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ramp();update()});
ramp();
if(window.kakao&&kakao.maps){kakao.maps.load(initMap)}else{document.getElementById('map').innerHTML='<p style="padding:16px;color:var(--muted)">카카오맵을 불러오지 못했습니다. 등록된 주소(jykeagle1-code.github.io)에서 열어 주세요.</p>';update()}
</script>
